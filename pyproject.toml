[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-office-kernel"
version = "0.1.0"
description = "Telegram-driven multi-agent AI office kernel for local and CLI-backed agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=20,<22",
  "pexpect>=4.9; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ai-office-kernel = "ai_office_kernel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

